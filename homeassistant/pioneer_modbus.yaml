# Pioneer (TCL-built) ducted indoor unit: Home Assistant package
#
# One indoor unit over an RS485-to-TCP gateway, using Home Assistant's built-in
# Modbus integration. Gives a thermostat (climate entity), switches for the
# eco/turbo/silent/sleep/display functions, and status sensors.
#
# The thermostat and switches WRITE to the unit with Modbus function 06, which
# the unit accepts (tested on the display register). Remove the climates: and
# switches: sections if you want a read-only install.
#
# Install: see README.md, "Step 6". In short:
#   1. Enable packages in configuration.yaml:
#        homeassistant:
#          packages: !include_dir_named packages
#   2. Copy this file to /config/packages/ (or generate one per unit with
#      tools/make_ha_package.py).
#   3. Set host and port below, then restart Home Assistant.
#
# Only ONE Modbus client may talk to a gateway port at a time. While Home
# Assistant is polling, don't run tools/tcl_modbus.py on the same port.

modbus:
  - name: pioneer_unit_2
    type: rtuovertcp          # raw Modbus RTU frames over a transparent TCP socket
    host: 192.168.1.50        # <-- your RS485-to-TCP gateway
    port: 26                  # <-- TCP port of the serial port the unit is wired to
    timeout: 3
    delay: 1
    message_wait_milliseconds: 50

    climates:
      - name: Pioneer Unit 2
        unique_id: pioneer_unit_2_climate
        device_address: 1
        address: 792                  # 0x0318 room temperature
        input_type: holding
        data_type: uint16
        current_temp_scale: 0.1       # (raw - 1000) / 10 °C
        current_temp_offset: -100
        target_temp_register: 515     # 0x0203 setpoint, °C x 10
        target_temp_scale: 0.1
        target_temp_offset: 0
        precision: 1
        temperature_unit: C
        min_temp: 16                  # unit limits (0x0216 / 0x0215)
        max_temp: 31
        temp_step: 1                  # the unit stores whole °C only
        hvac_onoff_register: 513      # 0x0201: 0 off, 1 on
        hvac_mode_register:
          address: 514                # 0x0202
          values:
            state_cool: 1
            state_dry: 2
            state_fan_only: 3
            state_heat: 4
            state_auto: 5
        # No hvac_action_register: 0x0310 keeps its last mode while the unit is
        # off, so HA would show "cooling" on a unit that is switched off.
        fan_mode_register:
          address: 516                # 0x0204. HA's fixed names map to speeds 1-5:
          values:
            state_fan_auto: 1
            state_fan_low: 2          # speed 1
            state_fan_middle: 3       # speed 2
            state_fan_medium: 4       # speed 3
            state_fan_high: 5         # speed 4
            state_fan_top: 6          # speed 5
        scan_interval: 10

    switches:
      - name: Pioneer Unit 2 Eco
        unique_id: pioneer_unit_2_eco_switch
        device_address: 1
        address: 521                  # 0x0209
        write_type: holding
        command_on: 1
        command_off: 0
        verify:
          input_type: holding
          address: 521
          state_on: 1
          state_off: 0
        scan_interval: 15
      - name: Pioneer Unit 2 Turbo
        unique_id: pioneer_unit_2_turbo_switch
        device_address: 1
        address: 519                  # 0x0207
        write_type: holding
        command_on: 1
        command_off: 0
        verify:
          input_type: holding
          address: 519
          state_on: 1
          state_off: 0
        scan_interval: 15
      - name: Pioneer Unit 2 Silent
        unique_id: pioneer_unit_2_silent_switch
        device_address: 1
        address: 520                  # 0x0208
        write_type: holding
        command_on: 1
        command_off: 0
        verify:
          input_type: holding
          address: 520
          state_on: 1
          state_off: 0
        scan_interval: 15
      - name: Pioneer Unit 2 Sleep
        unique_id: pioneer_unit_2_sleep_switch
        device_address: 1
        address: 522                  # 0x020A
        write_type: holding
        command_on: 1
        command_off: 0
        verify:
          input_type: holding
          address: 522
          state_on: 1
          state_off: 0
        scan_interval: 15
      - name: Pioneer Unit 2 Display Light
        unique_id: pioneer_unit_2_display_switch
        device_address: 1
        address: 525                  # 0x020D stores "display OFF": 0 = lit
        write_type: holding
        command_on: 0
        command_off: 1
        verify:
          input_type: holding
          address: 525
          state_on: 0
          state_off: 1
        scan_interval: 30

    sensors:
      - name: Pioneer Unit 2 Room Temperature
        unique_id: pioneer_unit_2_room_temperature
        device_address: 1
        address: 792          # 0x0318: (raw - 1000) / 10 °C
        input_type: holding
        data_type: uint16
        scale: 0.1
        offset: -100
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 15
      - name: Pioneer Unit 2 Coil Temperature
        unique_id: pioneer_unit_2_coil_temperature
        device_address: 1
        address: 794          # 0x031A: indoor coil, (raw - 1000) / 10 °C
        input_type: holding
        data_type: uint16
        scale: 0.1
        offset: -100
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 15
      - name: Pioneer Unit 2 Setpoint
        unique_id: pioneer_unit_2_setpoint
        device_address: 1
        address: 515          # 0x0203: °C x 10, whole degrees
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 0
        unit_of_measurement: "°C"
        device_class: temperature
        scan_interval: 15
      - name: Pioneer Unit 2 Fan RPM
        unique_id: pioneer_unit_2_fan_rpm
        device_address: 1
        address: 791          # 0x0317: indoor fan actual RPM
        input_type: holding
        data_type: uint16
        unit_of_measurement: "rpm"
        state_class: measurement
        scan_interval: 15
      - name: Pioneer Unit 2 Timer Remaining
        unique_id: pioneer_unit_2_timer_remaining
        device_address: 1
        address: 800          # 0x0320: minutes (countdown not yet verified)
        input_type: holding
        data_type: uint16
        unit_of_measurement: "min"
        device_class: duration
        scan_interval: 60
      - name: Pioneer Unit 2 Fan Running Raw
        unique_id: pioneer_unit_2_fan_running_raw
        device_address: 1
        address: 785          # 0x0311: 1 stopped, 2-6 speed 1-5, 7 turbo, 8 silent
        input_type: holding
        data_type: uint16
        scan_interval: 15
      - name: Pioneer Unit 2 Compressor Raw
        unique_id: pioneer_unit_2_compressor_raw
        device_address: 1
        address: 788          # 0x0314: 8 running, 0 stopped
        input_type: holding
        data_type: uint16
        scan_interval: 10

template:
  - sensor:
      - name: Pioneer Unit 2 Fan Running
        unique_id: pioneer_unit_2_fan_running
        icon: mdi:fan-auto
        state: >
          {% set fan = states('sensor.pioneer_unit_2_fan_running_raw') %}
          {% if fan in ['unknown', 'unavailable'] %}unavailable
          {% else %}{{ {1: 'stopped', 2: '1', 3: '2', 4: '3', 5: '4', 6: '5', 7: 'turbo', 8: 'silent'}.get(fan | int(0), 'unknown') }}
          {% endif %}

  - binary_sensor:
      - name: Pioneer Unit 2 Compressor
        unique_id: pioneer_unit_2_compressor
        device_class: running
        state: "{{ states('sensor.pioneer_unit_2_compressor_raw') | int(0) > 0 }}"
        availability: "{{ has_value('sensor.pioneer_unit_2_compressor_raw') }}"
